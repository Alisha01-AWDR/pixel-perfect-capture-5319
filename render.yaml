services:
  - type: web
    name: darukaa-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: darukaa-postgis-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: darukaa-postgis-db
    plan: starter
    databaseName: darukaa
    user: postgres
